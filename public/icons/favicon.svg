<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Coolbrew favicon</title>
  <desc id="desc">A minimal cold brew tumbler with a mint-colored ice cube on a deep navy background.</desc>
  <rect width="64" height="64" rx="15" fill="#162831"/>
  <!-- The rim and tapered silhouette of a cold brew glass. -->
  <!-- <path d="M17 19H47" fill="none" stroke="#F5F5ED" stroke-width="4.5" stroke-linecap="round"/> -->
  <path d="M20 22L23.5 48.5C23.9 51.2 26.2 53 29 53H35C37.8 53 40.1 51.2 40.5 48.5L44 22"
        fill="none" stroke="#F5F5ED" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A single ice cube is the "cold" in coolbrew. -->
  <rect x="26" y="29" width="12" height="12" rx="2.2" transform="rotate(-15 32 35)" fill="#85D8CF"/>
</svg>
